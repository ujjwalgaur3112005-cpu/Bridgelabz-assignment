<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }


    header, footer {
        position: fixed;
        width: 100%;
        left: 0;
        background: #222;
        color: white;
        padding: 15px 0;
        z-index: 10;
    }

    header { top: 0; }
    footer { bottom: 0; }

    section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
    }

    .linear {
        background: linear-gradient(120deg, #3498db, #8e44ad);
    }

    .radial {
        background: radial-gradient(circle, #f1c40f, #e74c3c, #8e44ad);
        background-attachment: fixed;
    }
</style>


</head>
<body>
    <header><h2>Gradient Webpage</h2></header>


<section class="linear">
    <h1>Linear Gradient</h1>
    <p>Colors blend along a straight line.</p>
</section>

<section class="radial">
    <h1>Radial Gradient</h1>
    <p>Colors spread outward from a central point.</p>
</section>

<footer>Gradient Background Demonstration</footer>


</body>
</html>
