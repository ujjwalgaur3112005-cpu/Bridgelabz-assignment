<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }


    .container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 25px;
    }

    .box {
        width: 25%;
        min-height: 120px;
        max-width: 250px;
        padding: 15px;
        overflow: auto;
        text-align: center;
        color: white;
    }

    .box1 {
        height: 150px;
        background: #3498db;
    }

    .box2 {
        height: 25vh;
        background: #2ecc71;
    }

    .box3 {
        height: 10em;
        background: #9b59b6;
    }
</style>


</head>
<body>
    <div class="container">
        <div class="box box1">
            <h2>Box 1</h2>
            <p>Height: 150px</p>
        </div>

```
    <div class="box box2">
        <h2>Box 2</h2>
        <p>Height: 25vh</p>
    </div>

    <div class="box box3">
        <h2>Box 3</h2>
        <p>Height: 10em</p>
    </div>
</div>


</body>
</html>
