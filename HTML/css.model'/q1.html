<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
        }


    .container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        margin-top: 50px;
    }

    .box {
        width: 150px;
        background: white;
        border: 4px solid;
        padding: 20px;
        border-radius: 10px;
        transition: border-color 0.3s ease;
    }

    .solid { border-style: solid; padding: 10px; }
    .dashed { border-style: dashed; padding: 20px; }
    .double { border-style: double; padding: 30px; }
    .groove { border-style: groove; padding: 40px; }

    .box:hover {
        border-color: #e74c3c;
    }
</style>
```

</head>
<body>
    <h1>Borders and Padding Demonstration</h1>

```
<div class="container">
    <div class="box solid">Solid Border</div>
    <div class="box dashed">Dashed Border</div>
    <div class="box double">Double Border</div>
    <div class="box groove">Groove Border</div>
</div>


</body>
</html>
