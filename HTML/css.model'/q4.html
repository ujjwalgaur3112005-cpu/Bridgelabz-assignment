<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
        }


    .container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 30px;
        margin: 60px 20px;
    }

    .card {
        width: 220px;
        padding: 30px 15px;
        background: white;
        border-radius: 12px;
        transition: all 0.4s ease;
    }

    .card h2 {
        text-shadow: 2px 2px 4px #aaa;
    }

    .shadow1 { box-shadow: 3px 3px 8px #999; }
    .shadow2 { box-shadow: 0 5px 15px #aaa; }
    .shadow3 { box-shadow: 0 0 15px #bbb; }

    .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px #888;
    }
</style>
