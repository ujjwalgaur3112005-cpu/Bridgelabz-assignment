<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ecf0f1;
        }


    form {
        max-width: 400px;
        margin: 60px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px #ccc;
    }

    h1 {
        text-align: center;
    }

    input, textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin: 18px 0;
        border: 1px solid #bbb;
        border-radius: 6px;
        font-size: 16px;
    }

    input:nth-of-type(1) {
        outline: 2px solid #3498db;
        outline-offset: 2px;
    }

    textarea {
        outline: 2px dashed #9b59b6;
        outline-offset: 2px;
    }

    input:focus, textarea:focus {
        outline: 3px solid #2ecc71;
        outline-offset: 3px;
        border-color: #2ecc71;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #3498db;
        color: white;
        cursor: pointer;
    }
</style>


</head>
<body>
    <form>
        <h1>Contact Form</h1>


    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea rows="5" placeholder="Your Message"></textarea>

    <button type="submit">Submit</button>
</form>


</body>
</html>
