<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

<div class="container mt-4 mb-3">
    <header class="text-center bg-primary text-white p-5 rounded">
        <h1 class="fw-bold">Ujjwal Gaur</h1>
        <p class="lead">AI & Data Science Enthusiast | Web Developer</p>
    </header>

    <section class="text-center mt-4">
        <img src="https://placehold.co/180x180" alt="Profile Image"
             class="img-fluid rounded-circle mb-3" width="180" height="180">
        <h2>About Me</h2>
        <p>I am passionate about programming, AI, and modern web technologies.</p>
        <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
        <a href="resume.pdf" class="btn btn-outline-primary">Download CV</a>
    </section>

    <section id="contact" class="mt-5 mb-5">
        <h3 class="text-center mb-3">Contact Me</h3>
        <form class="mx-auto" style="max-width: 500px;">
            <input type="text" class="form-control mb-3" placeholder="Your Name" required>
            <input type="email" class="form-control mb-3" placeholder="Your Email" required>
            <textarea class="form-control mb-3" rows="4" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn btn-success w-100">Send Message</button>
        </form>
    </section>
</div>

</body>
</html>
