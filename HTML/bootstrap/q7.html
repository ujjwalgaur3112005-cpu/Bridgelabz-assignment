<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">My Tasks</h3>
            <span class="badge bg-danger" id="pendingCount">3 Pending</span>
        </div>

        <ul class="list-group list-group-flush" id="taskList">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Complete Java Assignment
                <span class="badge bg-danger">High</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Study Bootstrap
                <span class="badge bg-warning text-dark">Medium</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Organize Notes
                <span class="badge bg-success">Low</span>
            </li>
        </ul>

        <div class="card-body text-center">
            <button class="btn btn-success" id="completeBtn">
                Completed <span class="badge bg-light text-dark" id="completedCount">0</span>
            </button>
        </div>
    </div>
</div>

<script>
    let pending = 3;
    let completed = 0;

    document.getElementById("completeBtn").addEventListener("click", function () {
        const taskList = document.getElementById("taskList");

        if (taskList.children.length > 0) {
            taskList.removeChild(taskList.lastElementChild);
            pending--;
            completed++;

            document.getElementById("pendingCount").textContent = pending + " Pending";
            document.getElementById("completedCount").textContent = completed;
        }

        if (pending === 0) {
            document.getElementById("pendingCount").textContent = "All Done!";
        }
    });
</script>

</body>
</html>
