<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Notifications Dashboard</h2>
        </div>

        <div class="card-body">
            <div class="alert alert-success" role="alert">
                <strong>Success!</strong> Your profile has been updated.
            </div>

            <div class="alert alert-info" role="alert">
                <strong>Tip:</strong> Complete your profile to improve your experience.
            </div>

            <div class="alert alert-danger" role="alert">
                <strong>Warning!</strong> Your password will expire soon.
            </div>

            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                <strong>New Message:</strong> You have received a new notification.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="bg-light border rounded p-4 mt-4">
                <h4>Summary</h4>
                <p class="mb-1">Total Notifications: 4</p>
                <p class="mb-0">Unread Notifications: 1</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
