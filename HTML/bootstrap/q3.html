<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 1rem 2rem rgba(0,0,0,0.15) !important;
        }
        .product-card img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-5">Our Products</h1>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://placehold.co/300x200?text=Headphones" class="card-img-top" alt="Headphones">
                <div class="card-body text-center">
                    <h5>Headphones</h5>
                    <p class="text-success fw-bold">₹999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://placehold.co/300x200?text=Smartwatch" class="card-img-top" alt="Smartwatch">
                <div class="card-body text-center">
                    <h5>Smartwatch</h5>
                    <p class="text-success fw-bold">₹1,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://placehold.co/300x200?text=Speaker" class="card-img-top" alt="Speaker">
                <div class="card-body text-center">
                    <h5>Bluetooth Speaker</h5>
                    <p class="text-success fw-bold">₹799</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">
                <img src="https://placehold.co/300x200?text=Keyboard" class="card-img-top" alt="Keyboard">
                <div class="card-body text-center">
                    <h5>Keyboard</h5>
                    <p class="text-success fw-bold">₹1,199</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
