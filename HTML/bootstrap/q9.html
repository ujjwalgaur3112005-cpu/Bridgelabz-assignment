<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-4">My Blog Posts</h1>

    <div class="row g-3 mb-5">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h4>Introduction to Bootstrap</h4>
                    <p>Learn how Bootstrap makes responsive website development easier.</p>
                    <a href="#" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h4>Getting Started with JavaScript</h4>
                    <p>Explore the fundamentals of JavaScript and interactive websites.</p>
                    <a href="#" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>
    </div>

    <nav aria-label="Blog pagination">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled">
                <a class="page-link" href="#" aria-disabled="true">Previous</a>
            </li>
            <li class="page-item active">
                <a class="page-link" href="#" aria-current="page">1</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">2</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">Next</a>
            </li>
        </ul>
    </nav>

    <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-outline-secondary">← Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts →</button>
    </div>
</div>

</body>
</html>
