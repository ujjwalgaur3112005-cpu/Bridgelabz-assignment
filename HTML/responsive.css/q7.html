<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Typography</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.7;
        }

        h1 {
            font-size: 36px;
            color: darkblue;
            text-align: center;
        }

        .normal {
            font-size: 16px;
            font-weight: normal;
        }

        .bold {
            font-size: 20px;
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .spacing {
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .custom {
            font-family: Georgia, serif;
            text-align: justify;
            line-height: 2;
        }
    </style>
</head>
<body>
    <h1>CSS Typography Examples</h1>

    <p class="normal">This is normal text.</p>
    <p class="bold">This is bold text.</p>
    <p class="italic">This is italic text.</p>
    <p class="spacing">Letter Spacing Example</p>
    <p class="custom">CSS typography helps control the appearance of text on a webpage. You can change font family, size, weight, alignment and spacing to make content easier to read.</p>
</body>
</html>
