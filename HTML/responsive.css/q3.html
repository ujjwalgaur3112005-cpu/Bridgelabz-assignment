<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        .gradient-box {
            height: 150px;
            margin: 20px auto;
            max-width: 700px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .linear {
            background: linear-gradient(to right, blue, purple);
        }

        .radial {
            background: radial-gradient(circle, orange, red);
        }

        .diagonal {
            background: linear-gradient(135deg, green, turquoise);
        }
    </style>
</head>
<body>
    <h1>CSS Gradient Examples</h1>

    <div class="gradient-box linear">Linear Gradient</div>
    <div class="gradient-box radial">Radial Gradient</div>
    <div class="gradient-box diagonal">Diagonal Gradient</div>
</body>
</html>
