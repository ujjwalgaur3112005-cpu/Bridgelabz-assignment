<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 15px 25px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
        }

        .nav-links a:hover {
            background: steelblue;
            border-radius: 5px;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
                text-align: center;
                gap: 5px;
            }

            .nav-links a {
                display: block;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MyWebsite</div>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <div class="content" id="home">
        <h1>Welcome to My Website</h1>
        <p>This navigation bar adjusts to different screen sizes.</p>
    </div>
</body>
</html>
