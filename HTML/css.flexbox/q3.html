<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>
    <style>
        * {
            box-sizing: border-box;
        }


    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
    }

    header {
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        padding: 20px;
        background: #34495e;
        color: white;
    }

    header a {
        color: white;
        text-decoration: none;
        margin: 8px;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
        flex-wrap: wrap;
        padding: 40px 20px;
    }

    .box {
        width: 220px;
        min-height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #3498db;
        color: white;
        border-radius: 12px;
        transition: transform 0.3s;
    }

    .box:hover {
        transform: rotate(2deg);
    }

    footer {
        width: 100%;
        padding: 20px;
        text-align: center;
        background: #34495e;
        color: white;
    }

    @media (max-width: 600px) {
        main {
            flex-direction: column;
        }
    }
</style>


</head>
<body>
    <header>
        <h2>My Homepage</h2>
        <nav>
            <a href="#services">Services</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>


<main>
    <div class="box" id="services"><h2>Services</h2></div>
    <div class="box" id="projects"><h2>Projects</h2></div>
    <div class="box" id="contact"><h2>Contact</h2></div>
</main>

<footer>
    <p>&copy; 2026 My Homepage</p>
</footer>


</body>
</html>
