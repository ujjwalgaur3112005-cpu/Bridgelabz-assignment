<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }


    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 8%;
        background: #2c3e50;
        color: white;
    }

    nav {
        display: flex;
        gap: 20px;
    }

    nav a {
        color: white;
        text-decoration: none;
    }

    main {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
        padding: 40px 8%;
    }

    .about, .image-section {
        flex: 1;
    }

    .image-section {
        text-align: center;
    }

    .image-section img {
        width: 100%;
        max-width: 350px;
        border-radius: 15px;
    }

    footer {
        text-align: center;
        padding: 20px;
        background: #2c3e50;
        color: white;
    }

    @media (max-width: 700px) {
        header, main {
            flex-direction: column;
            text-align: center;
        }

        nav {
            flex-wrap: wrap;
            justify-content: center;
        }
    }
</style>


</head>
<body>
    <header>
        <h2>Ujjwal Gaur</h2>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>


<main>
    <section class="about" id="about">
        <h1>About Me</h1>
        <p>Hello! I am a Computer Science graduate interested in
        web development, Artificial Intelligence and new technologies.</p>
        <p id="skills"><strong>Skills:</strong> HTML, CSS, JavaScript and Java.</p>
    </section>

    <section class="image-section">
        <img src="https://placehold.co/350x300?text=My+Photo" alt="Portfolio profile placeholder">
    </section>
</main>

<footer id="contact">
    <p>&copy; 2026 Ujjwal Gaur. All rights reserved.</p>
</footer>


</body>
</html>
