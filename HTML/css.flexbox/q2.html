<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background: #f4f6f8;
        }


    h1 {
        text-align: center;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
    }

    .card {
        min-height: 160px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 3px 10px #ddd;
        transition: transform 0.3s;
    }

    .card:hover {
        transform: scale(1.05);
    }

    .price {
        color: #16a085;
        font-weight: bold;
    }

    @media (max-width: 900px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 500px) {
        .gallery {
            grid-template-columns: 1fr;
        }
    }
</style>


</head>
<body>
    <h1>Product Gallery</h1>


<div class="gallery">
    <div class="card"><h3>Laptop</h3><p class="price">₹55,000</p></div>
    <div class="card"><h3>Smartphone</h3><p class="price">₹25,000</p></div>
    <div class="card"><h3>Headphones</h3><p class="price">₹2,000</p></div>
    <div class="card"><h3>Keyboard</h3><p class="price">₹1,500</p></div>
    <div class="card"><h3>Mouse</h3><p class="price">₹800</p></div>
    <div class="card"><h3>Monitor</h3><p class="price">₹12,000</p></div>
    <div class="card"><h3>Smartwatch</h3><p class="price">₹4,000</p></div>
    <div class="card"><h3>Speaker</h3><p class="price">₹2,500</p></div>
</div>


</body>
</html>
