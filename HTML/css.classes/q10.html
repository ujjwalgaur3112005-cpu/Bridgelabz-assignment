<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini User Interface</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    display: flex;
    flex-direction: column;
}
header {
    padding: 20px 30px;
    background: #1e293b;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
header h1 { margin: 0; font-size: 24px; }
nav { display: flex; gap: 18px; flex-wrap: wrap; }
nav a {
    color: white;
    text-decoration: none;
    transition: color 0.3s ease;
}
nav a:hover { color: #93c5fd; }
main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 16px;
}
.card {
    width: 100%;
    max-width: 600px;
    padding: 28px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 8px 25px #0001;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.card img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 10px;
}
form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
input {
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}
input:focus {
    outline: 2px solid #2563eb;
    border-color: #2563eb;
}
.buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
button {
    flex: 1;
    padding: 12px;
    border: 1px solid #2563eb;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.3s ease;
}
button:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}
button:active { transform: scale(0.98); }
button:focus-visible {
    outline: 3px solid #f59e0b;
    outline-offset: 3px;
}
button.secondary {
    background: white;
    color: #2563eb;
}
button.secondary:hover { background: #eff6ff; }
footer {
    padding: 18px;
    background: #e2e8f0;
    text-align: center;
    color: #475569;
}
@media (max-width: 480px) {
    header { flex-direction: column; text-align: center; }
    .card { padding: 20px; }
    .buttons { flex-direction: column; }
}
</style>
</head>
<body>
<header>
    <h1>My Mini UI</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>
    <section class="card">
        <h2>Welcome!</h2>
        <p>Enter your details to get started with our simple interface.</p>

        <img
            src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=80"
            alt="Modern workspace">

        <form action="#" onsubmit="return false;">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset" class="secondary">Reset</button>
            </div>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 My Mini UI. All rights reserved.</p>
</footer>
</body>
</html>
