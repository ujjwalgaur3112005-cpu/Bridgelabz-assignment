<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Button Collection</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
h1 { color: #1e293b; text-align: center; }
.button-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 18px;
    background: white;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 6px 20px #0001;
}
button {
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s ease;
}
.primary {
    background: #2563eb;
    color: white;
    border: 2px solid #2563eb;
}
.primary:hover { background: #1d4ed8; }
.primary:active { transform: scale(0.95); }

.secondary {
    background: #64748b;
    color: white;
    border: 2px solid #64748b;
}
.secondary:hover { background: #475569; }

.outline {
    background: white;
    color: #2563eb;
    border: 2px solid #2563eb;
}
.outline:hover { background: #dbeafe; }

button:focus-visible {
    outline: 3px solid #f59e0b;
    outline-offset: 4px;
}

button:disabled {
    background: #cbd5e1;
    color: #64748b;
    border-color: #cbd5e1;
    cursor: not-allowed;
    box-shadow: none;
}
</style>
</head>
<body>
<h1>Styled Button Collection</h1>

<div class="button-container">
    <button class="primary">Primary Button</button>
    <button class="secondary">Secondary Button</button>
    <button class="outline">Outline Button</button>
    <button disabled>Disabled Button</button>
</div>

<p>Hover over buttons, click them, or use Tab to test focus.</p>
</body>
</html>
