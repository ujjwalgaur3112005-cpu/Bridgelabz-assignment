<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation Demo</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
}
h1 { color: #1e293b; text-align: center; }
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 60px;
    padding: 35px;
}
.animation-box {
    width: 100px;
    height: 100px;
    background: #3b82f6;
    border-radius: 12px;
    animation: moveBox 2s ease-in-out infinite alternate;
}
.ball {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #f97316;
    animation: bounce 1s ease-in-out infinite;
    animation-delay: 0.3s;
}
.animated-text {
    font-size: 24px;
    font-weight: bold;
    animation: changeColor 3s ease-in-out infinite alternate;
    animation-direction: alternate;
}
@keyframes moveBox {
    from { transform: translateX(-25px) rotate(0deg); }
    to { transform: translateX(25px) rotate(20deg); }
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-60px); }
}
@keyframes changeColor {
    0% { color: #2563eb; }
    50% { color: #9333ea; }
    100% { color: #db2777; }
}
@media (prefers-reduced-motion: reduce) {
    .animation-box, .ball, .animated-text {
        animation-duration: 0.01ms;
        animation-iteration-count: 1;
    }
}
</style>
</head>
<body>
<h1>CSS Animation Demonstration</h1>

<div class="container">
    <div>
        <h3>Moving Box</h3>
        <div class="animation-box"></div>
    </div>

    <div>
        <h3>Bouncing Ball</h3>
        <div class="ball"></div>
    </div>

    <div>
        <h3>Color-Changing Text</h3>
        <p class="animated-text">CSS is Awesome!</p>
    </div>
</div>
</body>
</html>
