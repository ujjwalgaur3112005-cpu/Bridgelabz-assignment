<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Showcase</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f8fafc;
}
h1 { text-align: center; color: #1e293b; }
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 1100px;
    margin: 30px auto;
}
figure {
    margin: 0;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px #0002;
}
.image-box {
    position: relative;
    overflow: hidden;
}
img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    transition: transform 0.3s ease;
}
.image-box::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity 0.3s ease;
}
figure:hover img { transform: scale(1.1); }
figure:hover .image-box::after { opacity: 0.3; }
figcaption {
    padding: 14px;
    text-align: center;
    font-weight: bold;
    color: #334155;
}
@media (max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 700px) {
    .gallery { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<h1>Beautiful Image Showcase</h1>

<div class="gallery">
    <figure>
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape">
        </div>
        <figcaption>Mountain Escape</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Ocean beach">
        </div>
        <figcaption>Ocean Breeze</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Green forest">
        </div>
        <figcaption>Green Forest</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake and mountains">
        </div>
        <figcaption>Peaceful Lake</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80" alt="Ocean waves">
        </div>
        <figcaption>Ocean Waves</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80" alt="Sunrise over nature">
        </div>
        <figcaption>Golden Sunrise</figcaption>
    </figure>
</div>
</body>
</html>
