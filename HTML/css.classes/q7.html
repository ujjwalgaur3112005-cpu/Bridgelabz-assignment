<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Components</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #f3e8ff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.card {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px #1e293b20;
    display: flex;
    flex-direction: column;
    gap: 18px;
}
h1 { margin: 0; color: #1e293b; text-align: center; }
p { color: #64748b; text-align: center; }
input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}
input:focus, select:focus {
    outline: 2px solid #6366f1;
    border-color: #6366f1;
    background: #eef2ff;
}
button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s ease;
}
button:hover { background: #3730a3; }
button:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="card">
    <h1>Explore Dashboard</h1>
    <p>Find information and manage your preferences.</p>

    <form action="#" onsubmit="return false;">
        <label for="search">Search</label>
        <input id="search" type="search" placeholder="Search here...">
        <br><br>

        <label for="category">Choose a category</label>
        <select id="category">
            <option value="">Select category</option>
            <option>Technology</option>
            <option>Education</option>
            <option>Design</option>
        </select>
        <br><br>

        <button type="submit">Search Now</button>
    </form>

    <button type="button" onclick="alert('Profile opened!')">Open Profile</button>
</div>
</body>
</html>
