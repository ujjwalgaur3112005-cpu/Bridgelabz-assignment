<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined CSS Effects</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
h1 { text-align: center; color: #1e293b; }
.container {
    display: flex;
    justify-content: center;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 25px;
    max-width: 1000px;
}
.card {
    width: 220px;
    padding: 25px 18px;
    background: white;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 12px #0001;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px #0002;
}
button {
    padding: 12px 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.3s ease, background 0.3s ease,
                box-shadow 0.3s ease;
}
button:hover {
    background: #7c3aed;
    transform: scale(1.08);
    box-shadow: 0 5px 15px #7c3aed55;
}
button:active { transform: scale(0.96); }
button:focus-visible {
    outline: 3px solid #f59e0b;
    outline-offset: 4px;
}
a {
    color: #2563eb;
    text-decoration: none;
    transition: color 0.3s ease;
}
a:hover { color: #dc2626; text-decoration: underline; }
.badge {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 20px;
    background: #dbeafe;
    color: #1d4ed8;
    transition: transform 0.3s ease, background 0.3s ease;
}
.badge:hover {
    transform: rotate(-4deg) scale(1.1);
    background: #bfdbfe;
}
</style>
</head>
<body>
<h1>Combined CSS Effects</h1>

<div class="container">
    <section class="card">
        <h3>Interactive Button</h3>
        <p>Hover, click, or focus on the button.</p>
        <button>Explore</button>
    </section>

    <section class="card">
        <h3>Interactive Link</h3>
        <p>Hover to change the link color.</p>
        <a href="#">Learn More</a>
    </section>

    <section class="card">
        <h3>Animated Badge</h3>
        <p>Hover to rotate and enlarge the badge.</p>
        <span class="badge">NEW</span>
    </section>
</div>
</body>
</html>
