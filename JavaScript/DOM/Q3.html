<!DOCTYPE html>
<html>
<body>
    <h2>Multi-Step Form</h2>

    <form id="form">
        <div class="step">
            Name: <input type="text" id="name" required>
        </div>

        <div class="step" hidden>
            Email: <input type="email" id="email" required>
        </div>

        <div class="step" hidden>
            Password: <input type="password" id="password" minlength="6" required>
        </div>

        <button type="button" id="back" hidden>Back</button>
        <button type="button" id="next">Next</button>
    </form>

    <div id="summary"></div>

    <script>
        const steps = document.querySelectorAll(".step");
        const next = document.getElementById("next");
        const back = document.getElementById("back");

        let current = 0;

        function showStep() {
            steps.forEach((step, i) => {
                step.hidden = i !== current;
            });

            back.hidden = current === 0;
            next.textContent = current === 2 ? "Submit" : "Next";
        }

        next.addEventListener("click", function () {
            const input = steps[current].querySelector("input");

            if (!input.checkValidity()) {
                input.reportValidity();
                return;
            }

            if (current < 2) {
                current++;
                showStep();
            } else {
                document.getElementById("form").hidden = true;

                document.getElementById("summary").innerHTML = `
                    <h3>Form Completed Successfully!</h3>
                    <p>Name: ${document.getElementById("name").value}</p>
                    <p>Email: ${document.getElementById("email").value}</p>
                    <p>Password: ${"*".repeat(document.getElementById("password").value.length)}</p>
                `;
            }
        });

        back.addEventListener("click", function () {
            if (current > 0) {
                current--;
                showStep();
            }
        });

        showStep();
    </script>
</body>
</html>
