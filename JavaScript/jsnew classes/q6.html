```html
<!DOCTYPE html>
<html>
<body>
<script>
class Employee {
    constructor(id, name, department, salary) {
        this.id = id;
        this.name = name;
        this.department = department;
        this.salary = salary;
    }

    getAnnualSalary() {
        return this.salary * 12;
    }

    applyBonus(percent) {
        this.salary += this.salary * percent / 100;
    }
}

let employees = [
    new Employee(1, "Aman", "IT", 30000),
    new Employee(2, "Ravi", "HR", 25000),
    new Employee(3, "Priya", "IT", 40000),
    new Employee(4, "Neha", "Sales", 35000),
    new Employee(5, "Rahul", "Finance", 45000)
];

employees.forEach(emp => {
    console.log(emp.name, emp.getAnnualSalary());
});

let totalPayout = employees.reduce((total, emp) => {
    return total + emp.getAnnualSalary();
}, 0);

console.log("Total Annual Payout:", totalPayout);
</script>
</body>
</html>
