<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        .gallery img {
            width: 150px;
            height: 120px;
            object-fit: cover;
            margin: 5px;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        #preview {
            max-width: 80%;
            max-height: 80%;
        }
    </style>
</head>
<body>

    <h2>Image Gallery</h2>

    <div class="gallery" id="gallery">
        <img src="https://picsum.photos/id/10/600/400" alt="Image 1">
        <img src="https://picsum.photos/id/20/600/400" alt="Image 2">
        <img src="https://picsum.photos/id/30/600/400" alt="Image 3">
        <img src="https://picsum.photos/id/40/600/400" alt="Image 4">
        <img src="https://picsum.photos/id/50/600/400" alt="Image 5">
        <img src="https://picsum.photos/id/60/600/400" alt="Image 6">
    </div>

    <div id="modal">
        <img id="preview" src="" alt="Preview">
    </div>

    <script>
        const gallery = document.getElementById("gallery");
        const modal = document.getElementById("modal");
        const preview = document.getElementById("preview");

        gallery.addEventListener("click", function (e) {
            if (e.target.tagName === "IMG") {
                preview.src = e.target.src;
                modal.style.display = "flex";
            }
        });

        modal.addEventListener("click", function () {
            modal.style.display = "none";
        });

        preview.addEventListener("click", function (e) {
            e.stopPropagation();
        });
    </script>

</body>
</html>
